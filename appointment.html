<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book an Appointment - WanderLux</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>WanderLux Travel Agency</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Destinations</a>
      <a href="calculator.html">Trip Cost Calculator</a>
      <a href="appointment.html">Appointment</a>
      <a href="about.html">About Us</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <section class="appointment">
    <h2>📅 Book Your Appointment</h2>
    <p>Fill out the form below and one of our travel consultants will get back to you shortly.</p>

    <form id="appointmentForm" onsubmit="validateAppointment(event)">
      <label>👤 Name:
        <input type="text" id="name" required>
      </label><br>

      <label>📧 Email:
        <input type="email" id="email" required>
      </label><br>

      <label>📞 Phone:
        <input type="tel" id="phone" required>
      </label><br>

      <label>📅 Preferred Date:
        <input type="date" id="date" required>
      </label><br>

      <label>📝 Message:
        <textarea id="message" rows="4" required></textarea>
      </label><br>

      <button type="submit">Submit Request ✨</button>
    </form>

    <div id="confirmation"></div>
  </section>
  <script>
  function validateAppointment(event) {
    event.preventDefault(); // stops auto-clear

    const name = document.getElementById("name").value.trim();
    const date = document.getElementById("date").value;

    document.getElementById("confirmation").innerText =
      `✅ Thank you, ${name}! Your appointment request for ${date} has been submitted. We’ll contact you soon.`;
  }
</script>
</body>
</html>

</body>
</html>
